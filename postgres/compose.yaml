
secrets:
  postgres_password:
    file: /opt/secrets/postgresql/postgres
  synapse_password:
    file: /opt/secrets/postgresql/synapse_user
  mas_password:
    file: /opt/secrets/postgresql/mas_user

services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/postgresql/data:rw
      - ./initdb.d/create-matrix-databases.sh:/docker-entrypoint-initdb.d/create-matrix-databases.sh
    networks:
      - pg-net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/data # otherwise it clashes with .gitkeep in the parent dir
    secrets:
      - postgres_password
      - synapse_password
      - mas_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix"]
      start_period: "1s"
      interval: "1s"
      timeout: "5s"

networks:
  pg-net:
    external: true