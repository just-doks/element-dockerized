{{ getenv "CONFIG_HEADER" }}

# taken from https://element-hq.github.io/synapse/latest/reverse_proxy.html
# mixed with https://github.com/wmnnd/nginx-certbot/tree/master/etc/nginx/conf.d/nginx

# log_format vhosts '$host $remote_addr - $remote_user [$time_local] '
#                   '"$request" $status $body_bytes_sent '
#                   '"$http_referer" "$http_user_agent"';
# access_log /dev/stdout vhosts;

map $http_origin $allow_origin {
    ~^https?://{{ getenv "ELEMENT_WEB_FQDN" }}?$ $http_origin;
    ~^https?://{{ getenv "ELEMENT_ADMIN_FQDN" }}?$ $http_origin;
    default "";
}

{{ if ne (getenv "DOMAIN") (getenv "HOMESERVER_FQDN") }}
server {
    server_name {{ getenv "DOMAIN" }};
    server_tokens off;

    listen 8080;

    location = / {
	return 302 https://{{ getenv "ELEMENT_WEB_FQDN" }};
    }

    location ~ ^/.well-known/(matrix|element)/ {
        root /var/www;
    }

    # XXX: is this right? or should auth.$DOMAIN be the issuer?
    location /.well-known/openid-configuration {
        proxy_pass http://mas:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
{{ end }}

server {
    server_name {{ getenv "HOMESERVER_FQDN" }};
    server_tokens off;

    listen 8080;

    {{ if eq (getenv "DOMAIN") (getenv "HOMESERVER_FQDN") }}
    location ~ ^/.well-known/(matrix|element)/ {
        root /var/www;
        add_header Content-Type application/json;
      	add_header "Access-Control-Allow-Origin" *;
    }

    location /.well-known/openid-configuration {
        proxy_pass http://mas:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Content-Type application/json;
      	add_header "Access-Control-Allow-Origin" *;
    }
    {{ end }}

    # pass auth to MAS
    location ~ ^/_matrix/client/(.*)/(login|logout|refresh) {
        include /etc/nginx/conf.d/include/cors.conf;
        proxy_pass http://mas:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/_matrix/client/(r0|v3)/sync$ {
        include /etc/nginx/conf.d/include/cors.conf;
        proxy_pass http://synapse:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/_matrix/client/(api/v1|r0|v3)/events$ {
        include /etc/nginx/conf.d/include/cors.conf;
        proxy_pass http://synapse:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/_matrix/client/(api/v1|r0|v3)/initialSync$ {
        include /etc/nginx/conf.d/include/cors.conf;
        proxy_pass http://synapse:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/_matrix/client/(api/v1|r0|v3)/rooms/[^/]+/initialSync$ {
        include /etc/nginx/conf.d/include/cors.conf;
        proxy_pass http://synapse:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TODO: add randezvue path handling

    location / {
        include /etc/nginx/conf.d/include/cors.conf;
        proxy_pass http://synapse:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Nginx by default only allows file uploads up to 1M in size
        # Increase client_max_body_size to match max_upload_size defined in homeserver.yaml
        client_max_body_size 50M;
    }

    # Synapse responses may be chunked, which is an HTTP/1.1 feature.
    proxy_http_version 1.1;
}

server {
    server_name {{ getenv "ELEMENT_ADMIN_FQDN" }};
    server_tokens off;

    listen 8080;

    location / {
        proxy_pass http://element-admin:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    server_name {{ getenv "ELEMENT_WEB_FQDN" }};
    server_tokens off;

    listen 8080;

    location / {
        proxy_pass http://element:80;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    server_name {{ getenv "MAS_FQDN" }};
    server_tokens off;

    listen 8080;

    location / {
        include /etc/nginx/conf.d/include/cors.conf;
        proxy_pass http://mas:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
